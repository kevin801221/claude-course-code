[project]
name = "backend"
version = "0.0.1"
description = "Normal-RAG2Graph-Project starter-kit backend"
readme = "README.md"
requires-python = ">=3.13"

# 起手式骨架只裝最低限度的依賴。
# Stage 1 開始後，學生會在跟 Antigravity 協作的過程中，
# 用 `uv add chromadb google-generativeai pypdf langchain-text-splitters` 等
# 把需要的套件補上。禁止用 pip / poetry。
dependencies = [
    "chromadb>=1.5.7",
    "fastapi[standard]>=0.135.3",
    "google-generativeai>=0.8.6",
    "langchain-text-splitters>=1.1.1",
    "pydantic>=2.12.5",
    "pypdf>=6.10.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
]
