[project]
name = "arxiv-backend"
version = "0.1.0"
description = "arXiv 每日論文閱讀器後端:抓取 + Gemini 摘要 + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "feedparser>=6.0.12",
    "google-genai>=2.6.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
